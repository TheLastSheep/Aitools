[package]
name = "aitools-telemetry"
version = "0.1.0"
edition = "2021"
description = "Chronological JSONL observability, secret redaction, panic flush, and diagnostic bundle exporter for aitools"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
