[package]
name = "aitools-cli"
version = "0.1.0"
edition = "2021"
description = "Official developer CLI, MCP server bridge, and DSH .ztrace replay harness for aitools"

[[bin]]
name = "aitools"
path = "src/main.rs"

[dependencies]
aitools-ai = { path = "../aitools-ai" }
aitools-core = { path = "../aitools-core" }
aitools-telemetry = { path = "../aitools-telemetry" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = "3"
