[package]
name = "aitools-ai"
version = "1.0.0"
edition = "2021"
description = "AI-native dual-mode launcher promotion, model broker, semantic tool router, 3-tier HITL guard, and harness primitives for aitools"

[dependencies]
aitools-core = { path = "../aitools-core" }
aitools-telemetry = { path = "../aitools-telemetry" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
