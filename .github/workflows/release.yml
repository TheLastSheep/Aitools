name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-flight-sdd-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Rust formatting, Clippy, Rustdoc, and tests
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo doc --workspace --no-deps
          cargo test --workspace
      - name: Replay golden .ztrace fixtures
        run: |
          for f in tests/traces/*.ztrace; do
            cargo run -p aitools-cli -- harness replay "$f" --assert-no-anomalies
          done
      - name: Audit built-in & example plugins
        run: |
          for p in plugins/builtin/* examples/plugins/*; do
            cargo run -p aitools-cli -- plugin audit "$p"
          done
      - name: Verify Svelte UI & SDK types
        run: |
          pnpm --filter @aitools/renderer-svelte check
          pnpm --filter @aitools/renderer-svelte build
          ./packages/renderer-svelte/node_modules/.bin/tsc -p packages/aitools-sdk/tsconfig.json --noEmit

  release:
    needs: pre-flight-sdd-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webkit & AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }},wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate & prepare updater signing key
        id: signing
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          function stripWrappingQuotes(s) {
            let out = String(s || '').trim();
            if ((out.startsWith('"') && out.endsWith('"')) || (out.startsWith("'") && out.endsWith("'"))) {
              out = out.slice(1, -1).trim();
            }
            return out;
          }

          const rawKey = stripWrappingQuotes(process.env.RAW_KEY);
          const rawPw = stripWrappingQuotes(process.env.RAW_PW);

          let cleanKey = '';
          let keyKind = 'empty';
          if (rawKey.startsWith('untrusted comment:')) {
            // Plaintext minisign key -> re-encode cleanly to base64 as expected by Tauri CLI.
            cleanKey = Buffer.from(rawKey.replace(/\r\n/g, '\n') + (rawKey.endsWith('\n') ? '' : '\n'), 'utf8').toString('base64');
            keyKind = 'plaintext_minisign';
          } else if (rawKey.length > 0) {
            const compact = rawKey.replace(/\s+/g, '');
            try {
              const decoded = Buffer.from(compact, 'base64').toString('utf8');
              if (decoded.includes('untrusted comment:')) {
                cleanKey = compact;
                keyKind = 'base64_minisign';
              } else {
                keyKind = 'invalid_decoded_header';
              }
            } catch {
              keyKind = 'invalid_base64';
            }
          }

          console.log(`Signing key check: raw_len=${rawKey.length}, kind=${keyKind}`);

          const outFile = process.env.GITHUB_OUTPUT;
          const envFile = process.env.GITHUB_ENV;
          if (!cleanKey) {
            console.log(
              '::warning::TAURI_SIGNING_PRIVATE_KEY is missing, empty, or invalid; disabling updater artifacts in src-tauri/tauri.conf.json for unsigned release build.'
            );
            const confPath = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            if (!conf.bundle) conf.bundle = {};
            conf.bundle.createUpdaterArtifacts = false;
            if (conf.plugins && conf.plugins.updater) {
              delete conf.plugins.updater;
              if (Object.keys(conf.plugins).length === 0) {
                delete conf.plugins;
              }
            }
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
            fs.appendFileSync(outFile, 'has_key=false\n');
            process.exit(0);
          }

          console.log(`::add-mask::${cleanKey}`);
          if (rawPw) {
            console.log(`::add-mask::${rawPw}`);
          }
          fs.appendFileSync(
            envFile,
            `TAURI_SIGNING_PRIVATE_KEY<<__AITOOLS_KEY__\n${cleanKey}\n__AITOOLS_KEY__\n`
          );
          fs.appendFileSync(
            envFile,
            `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__AITOOLS_PW__\n${rawPw}\n__AITOOLS_PW__\n`
          );
          fs.appendFileSync(outFile, 'has_key=true\n');
          NODE

      - name: Build Tauri release bundles & signed updater artifacts (latest.json)
        if: steps.signing.outputs.has_key == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'aitools ${{ github.ref_name }}'
          releaseBody: 'Automated multi-platform release verified by SDD Quality Gate (`SPEC-000` <= 18 MB installer budget).'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build unsigned Tauri release bundles (no signing key configured)
        if: steps.signing.outputs.has_key != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'aitools ${{ github.ref_name }}'
          releaseBody: 'Automated multi-platform release (unsigned fallback: configure TAURI_SIGNING_PRIVATE_KEY to enable latest.json auto-updater signing).'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Enforce SPEC-000 installer size budget (<= 18 MB)
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const bundleRoot = path.join('target', '${{ matrix.rust_target }}', 'release', 'bundle');
          const maxBytes = 18 * 1024 * 1024; // 18 MiB (SPEC-000 Hard CI Ceiling)
          const suffixes = ['.dmg', '.msi', '-setup.exe', '.deb', '.AppImage'];

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && suffixes.some((s) => entry.name.endsWith(s))) {
                acc.push(full);
              }
            }
          }

          const artifacts = [];
          walk(bundleRoot, artifacts);
          artifacts.sort();

          if (artifacts.length === 0) {
            console.error(`ERROR: No installer artifacts found under ${bundleRoot}`);
            process.exit(1);
          }

          let failed = false;
          for (const file of artifacts) {
            const size = fs.statSync(file).size;
            const mib = size / (1024 * 1024);
            const ok = size <= maxBytes;
            console.log(`[${ok ? 'OK' : 'EXCEEDED'}] ${file}: ${mib.toFixed(2)} MiB (${size} bytes)`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
